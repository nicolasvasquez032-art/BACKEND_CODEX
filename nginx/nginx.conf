worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimizaciones de Kernel e I/O de alta velocidad
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Compresión dinámica Gzip para reducir ancho de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Pool de servidores Backend en clúster (Factor VIII - Concurrencia Horizontal)
    upstream backend_cluster {
        least_conn; # Distribuye tráfico al contenedor con menos conexiones activas
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25M;

        # Configuración de Proxy Inverso con soporte WebSocket y Keep-Alive
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Cabeceras para WebSockets y Rate Limiting
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Resiliencia: si un nodo backend falla, reintentar de inmediato con otro
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
