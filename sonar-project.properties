sonar.organization=nicolasvasquez032-art
sonar.projectKey=nicolasvasquez032-art_BACKEND_CODEX
sonar.projectName=TalentMatch Backend
sonar.host.url=https://sonarcloud.io

# Source paths and tests relative to repository root
sonar.sources=backend/application,backend/domain,backend/infrastructure
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Python version & Coverage report
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclusions
sonar.exclusions=**/alembic/**,**/.venv/**,**/__pycache__/**,**/migrations/**,backend/tests/**,*.html,**/*.html,scripts/**,nginx/**
sonar.cpd.exclusions=backend/infrastructure/api/routers/**
