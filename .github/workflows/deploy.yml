name: Deploy to AWS EC2

on:
  push:
    branches:
      - desarrollo
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy and Restart Server
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
            # 1. Descargar la nueva imagen compilada (Cumplimiento Factor 5: Separación de Build y Run)
            docker pull ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest
            
            # 2. Asegurarse de que exista el archivo .env
            cd ~/BACKEND_CODEX/backend || mkdir -p ~/BACKEND_CODEX/backend
            touch .env
            
            # 3. Ejecutar migraciones de BD usando la imagen oficial
            docker run --rm --network host --env-file .env ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest alembic upgrade head
            
            # 4. Detener el contenedor actual si existe
            docker stop talentmatch-backend-prod || true
            docker rm talentmatch-backend-prod || true
            
            # 5. Levantar el nuevo servidor
            docker run -d \
              --name talentmatch-backend-prod \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              -e ENVIRONMENT="production" \
              -e CORS_ORIGINS="*" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest
          EOF
