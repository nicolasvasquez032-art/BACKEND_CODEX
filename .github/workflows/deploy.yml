name: Deploy to AWS EC2

on:
  push:
    branches:
      - desarrollo
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy and Restart Server
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
            cd ~/BACKEND_CODEX
            git fetch --all
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Instalar nuevas dependencias si las hay
            source venv/bin/activate
            cd backend
            pip install -e .
            
            # Ejecutar migraciones
            alembic upgrade head
            
            # Detener el servidor actual
            pkill -f uvicorn || true
            sleep 2
            
            # Levantar el servidor en background (usando tmux para evitar que muera con SSH)
            # Levantar el servidor en background y desconectarlo del terminal para que no muera con SSH
            bash -c "cd ~/BACKEND_CODEX/backend && source ../venv/bin/activate && nohup uvicorn infrastructure.api.app:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 & disown"
            sleep 3
          EOF
