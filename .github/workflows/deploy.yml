name: Deploy to AWS EC2

on:
  push:
    branches:
      - desarrollo
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Start PostgreSQL (for Integration Tests)
        run: |
          docker compose up -d postgres
          sleep 8

      - name: Initialize Database Models
        env:
          DATABASE_URL: postgresql+asyncpg://talentmatch:talentmatch@localhost:5432/talentmatch
        run: |
          cd backend
          python init_db.py

      - name: Run Unit & Integration Tests (Gate for Factor V)
        env:
          DATABASE_URL: postgresql+asyncpg://talentmatch:talentmatch@localhost:5432/talentmatch
        run: |
          cd backend
          python -m pytest

  build-and-push:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image (Immutable Release SHA + Latest)
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          RELEASE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build \
            -t "${DOCKER_USER}/talentmatch-backend:${RELEASE_TAG}" \
            -t "${DOCKER_USER}/talentmatch-backend:latest" .
          docker push "${DOCKER_USER}/talentmatch-backend:${RELEASE_TAG}"
          docker push "${DOCKER_USER}/talentmatch-backend:latest"

      - name: Build and Push ML Service Docker Image (Immutable Release SHA + Latest)
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          RELEASE_TAG: ${{ github.sha }}
        run: |
          cd ml_service
          docker build \
            -t "${DOCKER_USER}/talentmatch-ml-service:${RELEASE_TAG}" \
            -t "${DOCKER_USER}/talentmatch-ml-service:latest" .
          docker push "${DOCKER_USER}/talentmatch-ml-service:${RELEASE_TAG}"
          docker push "${DOCKER_USER}/talentmatch-ml-service:latest"

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key
        env:
          AWS_KEY: ${{ secrets.AWS_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$AWS_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and Restart Server
        env:
          RELEASE_TAG: ${{ github.sha }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          AWS_USER: ${{ secrets.AWS_USERNAME }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key.pem "${AWS_USER}@${AWS_HOST}" << EOF
            # 0. Instalar Docker automáticamente si no existe en el servidor
            if ! command -v docker &> /dev/null; then
                echo "Instalando Docker en el servidor EC2..."
                curl -fsSL https://get.docker.com -o get-docker.sh
                sudo sh get-docker.sh
            fi
            
            # 0.5 Limpiar espacio en el servidor Ubuntu (Cachés, logs antiguos)
            sudo apt-get clean
            sudo journalctl --vacuum-time=1h || true
            sudo rm -rf /var/log/journal/* || true
            sudo rm -rf /var/log/syslog* || true
            rm -rf ~/.cache/pip || true
            
            sudo systemctl restart docker || true
            
            # 1. Limpiar imágenes huérfanas sin borrar volúmenes persistentes de BD
            sudo docker image prune -af
            
            # 2. Descargar el release inmutable correspondiente a este commit (Factor V)
            sudo docker pull \${DOCKER_USER}/talentmatch-ml-service:\${RELEASE_TAG}
            sudo docker pull \${DOCKER_USER}/talentmatch-backend:\${RELEASE_TAG}
            
            # 3. Asegurarse de que exista el archivo .env
            cd ~/BACKEND_CODEX/backend || mkdir -p ~/BACKEND_CODEX/backend
            touch .env
            
            # 4. Factor XII: Migraciones de BD como proceso one-off con la imagen del release
            sudo docker run --rm --network host --env-file .env \${DOCKER_USER}/talentmatch-backend:\${RELEASE_TAG} alembic upgrade head
            
            # 5. Desplegar Microservicio de Machine Learning (Puerto 8001)
            sudo docker stop talentmatch-ml-service-prod || true
            sudo docker rm talentmatch-ml-service-prod || true
            sudo fuser -k 8001/tcp || true
            sudo docker run -d \
              --name talentmatch-ml-service-prod \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              -e PORT="8001" \
              -e WORKERS="2" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              \${DOCKER_USER}/talentmatch-ml-service:\${RELEASE_TAG}

            # 5.5 Desplegar Redis (Caché en Memoria y Broker Pub/Sub)
            if [ ! "\$(sudo docker ps -q -f name=talentmatch-redis)" ]; then
                sudo docker stop talentmatch-redis || true
                sudo docker rm talentmatch-redis || true
                sudo docker run -d \
                  --name talentmatch-redis \
                  --restart unless-stopped \
                  --network host \
                  redis:7-alpine redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
            fi

            # 6. Desplegar API Backend Principal (Puerto 8000)
            sudo docker stop talentmatch-backend-prod || true
            sudo docker rm talentmatch-backend-prod || true
            sudo fuser -k 8000/tcp || true
            sudo docker run -d \
              --name talentmatch-backend-prod \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              -e ENVIRONMENT="production" \
              -e CORS_ORIGINS="*" \
              -e ML_SERVICE_URL="http://localhost:8001" \
              -e REDIS_URL="redis://localhost:6379/0" \
              -e PORT="8000" \
              -e WORKERS="2" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              \${DOCKER_USER}/talentmatch-backend:\${RELEASE_TAG}

            # 7. Configurar cronjob de respaldo diario de PostgreSQL a las 02:00 AM
            if [ -f ~/BACKEND_CODEX/scripts/backup_db.sh ]; then
                chmod +x ~/BACKEND_CODEX/scripts/backup_db.sh
                mkdir -p ~/backups
                CRON_CMD="0 2 * * * /bin/bash \\\$HOME/BACKEND_CODEX/scripts/backup_db.sh >> \\\$HOME/backups/talentmatch_backup.log 2>&1"
                (crontab -l 2>/dev/null | grep -Fv "backup_db.sh" ; echo "\\\$CRON_CMD") | crontab -
                echo "Cronjob de respaldo diario configurado exitosamente."
            fi
          EOF
