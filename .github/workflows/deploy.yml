name: Deploy to AWS EC2

on:
  push:
    branches:
      - desarrollo
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy and Restart Server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key.pem ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
            # 0. Instalar Docker automáticamente si no existe en el servidor
            if ! command -v docker &> /dev/null; then
                echo "Instalando Docker en el servidor EC2..."
                curl -fsSL https://get.docker.com -o get-docker.sh
                sudo sh get-docker.sh
            fi
            
            # 0.5 Limpiar espacio agresivamente en el servidor Ubuntu (Cachés, logs antiguos)
            sudo apt-get clean
            sudo journalctl --vacuum-time=1h || true
            sudo rm -rf /var/log/journal/* || true
            sudo rm -rf /var/log/syslog* || true
            rm -rf ~/.cache/pip || true
            
            # Reiniciar Docker (Si el disco llegó al 100%, el socket se bloquea con permission denied)
            sudo systemctl restart docker || true
            
            # 1. Limpiar imágenes de Docker huérfanas
            sudo docker system prune -af --volumes
            
            # 2. Descargar la nueva imagen compilada
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest
            
            # 3. Asegurarse de que exista el archivo .env
            cd ~/BACKEND_CODEX/backend || mkdir -p ~/BACKEND_CODEX/backend
            touch .env
            
            # 4. Ejecutar migraciones de BD usando la imagen oficial
            sudo docker run --rm --network host --env-file .env ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest alembic upgrade head
            
            # 5. Detener el contenedor actual si existe
            sudo docker stop talentmatch-backend-prod || true
            sudo docker rm talentmatch-backend-prod || true
            
            # 5. Levantar el nuevo servidor
            sudo docker run -d \
              --name talentmatch-backend-prod \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              -e ENVIRONMENT="production" \
              -e CORS_ORIGINS="*" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ secrets.DOCKER_USERNAME }}/talentmatch-backend:latest
          EOF
