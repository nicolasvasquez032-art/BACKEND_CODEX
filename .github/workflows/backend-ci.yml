name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start services (Postgres)
        run: |
          docker compose -f ../docker-compose.yml up -d postgres
          sleep 10
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip install ".[dev]"
      - name: Security Vulnerability Scanner (OWASP)
        run: |
          pip install pip-audit
          pip-audit --desc on
      - name: Initialize Database
        run: |
          # Set env var to point to localhost so init_db uses the container exposed on 5432
          export DATABASE_URL=postgresql+asyncpg://talentmatch:talentmatch@localhost:5432/talentmatch
          python init_db.py
      - name: Run Tests
        run: |
          export DATABASE_URL=postgresql+asyncpg://talentmatch:talentmatch@localhost:5432/talentmatch
          export ML_SERVICE_URL=http://localhost:8001
          python -m pytest
