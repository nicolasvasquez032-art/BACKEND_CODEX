name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start services (Postgres & Redis)
        run: |
          docker compose -f ../docker-compose.yml up -d postgres redis
          sleep 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip install ".[dev]"
      - name: Security Vulnerability Scanner (OWASP)
        run: |
          pip install pip-audit
          pip-audit --desc on
      - name: Initialize Database
        run: |
          # Set env var to point to localhost so init_db uses the container exposed on 5432
          export DATABASE_URL=postgresql+asyncpg://talentmatch:talentmatch@localhost:5432/talentmatch
          python init_db.py
      - name: Run Tests with Coverage
        run: |
          export DATABASE_URL=postgresql+asyncpg://talentmatch:talentmatch@localhost:5432/talentmatch
          export ML_SERVICE_URL=http://localhost:8001
          python -m pytest --cov=. --cov-report=xml:coverage.xml
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
