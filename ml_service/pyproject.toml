[project]
name = "talentmatch-ml-service"
version = "0.1.0"
description = "Internal ML service for TalentMatch embeddings and recommendations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.1.0",
    "pydantic-settings>=2.4.0",
    "sentence-transformers>=3.0.1",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.4",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["domain*", "application*", "infrastructure*"]
